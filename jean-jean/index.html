<!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>Фаустин Маурис Жан-Жан — Нотная библиотека</title>
    
        <style>
            * {
                box-sizing: border-box;
            }
    
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f7f5f0;
                color: #222;
            }
    
            .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 35px 20px 60px;
            }
    
            .back {
                display: inline-block;
                margin-bottom: 35px;
                color: #555;
                text-decoration: none;
                font-size: 16px;
            }
    
            .back:hover {
                color: #000;
            }
    
            header {
                text-align: center;
                margin-bottom: 40px;
            }
    
            h1 {
                font-size: 36px;
                margin: 0 0 12px;
            }
    
            .subtitle {
                color: #777;
                font-size: 17px;
            }
    
            h2 {
                font-size: 27px;
                margin-bottom: 20px;
                border-bottom: 1px solid #ccc;
                padding-bottom: 10px;
            }
    
            .work {
                display: block;
                background: white;
                color: #222;
                padding: 15px 18px;
                margin: 10px 0;
                border-radius: 9px;
                font-size: 17px;
                box-shadow: 0 2px 7px rgba(0,0,0,0.06);
                transition: 0.2s;
            }
            
            .work summary {
                cursor: pointer;
                font-weight: 500;
                list-style: none;
                position: relative;
                padding-right: 30px;
            }
            
            .work summary::-webkit-details-marker {
                display: none;
            }
            
            .work summary::after {
                content: "⏏";
                position: absolute;
                right: 8px;
                top: 50%;
                font-size: 32px;
                font-weight: 300;
                color: #888;
                transform: translateY(-40%) rotate(180deg);
                transition: 0.2s;
            }
            
            .work[open] summary::after {
                transform: translateY(-70%) rotate(0deg);
            }
            
            .download {
                display: block;
                margin-top: 18px;
                padding-top: 15px;
                border-top: 1px solid #eee;
                color: #666;
                text-decoration: none;
                font-size: 16px;
            }
            
            .download:hover {
                color: #222;
            }
            .work:hover {
                background: #eee;
                transform: translateY(-1px);
            }
           
            .download {
                display: block;
                margin-top: 6px;
                color: #777;
                font-size: 14px;
            }
    
            .not-available {
                display: block;
                color: #999;
                font-size: 14px;
                margin-top: 6px;
            }
    
            footer {
                text-align: center;
                margin-top: 50px;
                color: #888;
                font-size: 14px;
            }
    
            max-width: 600px {
                h1 {
                    font-size: 28px;
                }
    
                h2 {
                    font-size: 24px;
                }
    
                .work {
                    font-size: 17px;
                }
            }
        </style>
    </head>
    
    <body>
    
    <div class="container">
    
        <a class="back" href="../">
            ← Назад к композиторам
        </a>
    
        <header>
    
            <h1>Фаустин Маурис Жан-Жан</h1>
    
            <div class="subtitle">
                Произведения для кларнета
            </div>
    
        </header>
    
        <h2>Произведения</h2>
    
         <details class="work"data-genre="piece">
    <summary>Гуисгандерия</summary>

    <a class="download" href="Guisganderie.pdf" download>
        🎼 Скачать сольную партию
    </a>

    <a class="download" href="Gisganderiapn.pdf" download>
        🎹 Скачать клавир
    </a>
</details>

        <footer>
            Нотная библиотека для кларнета не Тараканова, а Жукова.
        </footer>
    
    </div>
    
    </body>
    </html>
