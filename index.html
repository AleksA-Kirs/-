<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нотная библиотека</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f7f5f0;
            color: #222;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .search {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        h2 {
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-top: 35px;
        }

        .composer {
            display: block;
            background: white;
            padding: 18px;
            margin: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            color: #222;
            font-size: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .composer:hover {
            background: #eee;
        }
    </style>
</head>

<body>

    <h1>Нотная библиотека</h1>

    <div class="subtitle">
        Каталог произведений композиторов
    </div>

    <input
        class="search"
        type="text"
        placeholder="Поиск композитора..."
        onkeyup="searchComposers()"
        id="search"
    >

    <div id="composers">

        <h2>В</h2>

        <a class="composer" href="#">
            Вебер, Карл Мария фон
        </a>

        <a class="composer" href="#">
            Вивальди, Антонио
        </a>


        <h2>П</h2>

        <a class="composer" href="#">
            Пуленк, Франсис
        </a>

        <a class="composer" href="#">
            Прокофьев, Сергей
        </a>

    </div>

    <script>
        function searchComposers() {
            let search = document
                .getElementById("search")
                .value
                .toLowerCase();

            let composers = document.querySelectorAll(".composer");

            composers.forEach(function(composer) {
                let name = composer.textContent.toLowerCase();

                if (name.includes(search)) {
                    composer.style.display = "block";
                } else {
                    composer.style.display = "none";
                }
            });
        }
    </script>

</body>
</html>
