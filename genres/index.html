<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>По жанру — Нотная библиотека</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f0;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .back {
            display: inline-block;
            margin-bottom: 35px;
            color: #555;
            text-decoration: none;
            font-size: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 36px;
            margin: 0 0 12px;
        }

        .subtitle {
            color: #777;
            font-size: 17px;
        }

        .work {
            display: block;
            background: white;
            color: #222;
            padding: 18px;
            margin: 12px 0;
            border-radius: 9px;
            font-size: 17px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.06);
        }

        .work-title {
            font-weight: 500;
        }

        .composer {
            display: block;
            margin-top: 5px;
            color: #888;
            font-size: 14px;
        }

        .download {
            display: block;
            margin-top: 12px;
            color: #666;
            text-decoration: none;
            font-size: 15px;
        }

        .download:hover {
            color: #222;
        }

        .message {
            text-align: center;
            color: #888;
            margin-top: 30px;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back" href="../">
        ← Назад к композиторам
    </a>

    <header>
        <h1>Концерты</h1>

        <div class="subtitle">
            Произведения для кларнета
        </div>
    </header>

    <div id="works">
        <div class="message">Загрузка произведений...</div>
    </div>

    <footer>
        Нотная библиотека для кларнета не Тараканова, а Жукова.
    </footer>

</div>

<script src="../data/genres.js"></script>

<script>

const composers = [
    {
        name: "Вебер, Карл Мария",
        page: "../weber/"
    }
];

async function showConcerts() {

    const container = document.getElementById("works");

    container.innerHTML = "";

    let found = false;

    for (const composer of composers) {

        const works = await loadComposerWorks(composer.page);

        works.forEach(function(work) {

            if (work.genre !== "concert") {
                return;
            }

            found = true;

            const block = document.createElement("div");
            block.className = "work";

            block.innerHTML = `
                <div class="work-title">
                    ${work.title}
                </div>

                <div class="composer">
                    ${composer.name}
                </div>
            `;

            work.files.forEach(function(file) {

                const link = document.createElement("a");

                link.className = "download";
                link.href = file.href;
                link.download = "";
                link.textContent = file.text;

                block.appendChild(link);
            });

            container.appendChild(block);
        });
    }

    if (!found) {
        container.innerHTML =
            '<div class="message">Пока произведений этого жанра нет.</div>';
    }
}

showConcerts();

</script>

</body>
</html>
